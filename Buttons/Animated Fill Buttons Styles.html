body {
  margin: 0;

  overflow: hidden;
  margin: 0 auto;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

.container {

  grid-template-columns: repeat(3, 1fr);
  gap: 24px;

  align-items: center;
}

.var-button-container {
  text-decoration: none;
  padding: 0;
  margin: 0;
}

.var-button-wrapper {
  position: relative;
  display: flex;
  height: 52px;
  padding: 0px 24px;
  align-items: center;
  gap: 4px;
  overflow: hidden;
  place-self: center;
  border: 1.3px solid transparent;

  &::after {
    content: "";
    position: absolute;
    left: -290px;
    bottom: -264px;
    width: 250px;
    height: 250px;
    aspect-ratio: 1/1;
    transition: all 0.6s ease-in-out;

  .var-button-text {
    font-family: "Geist", sans-serif;
    font-size: 16px;
    font-style: normal;
    font-weight: 400;
    line-height: 16px;
    text-transform: uppercase;
    transition: all 0.8s ease-in-out;
    z-index: 1;
  }

  .var-button-icon {
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    z-index: 1;
    translate: 0px;
    transition: all 0.8s ease-in-out;

    svg {
      width: 16px;
      height: 16px;
    }

    .var-button-icon-2 {
      position: absolute;
      bottom: 0;
      left: 0;
      opacity: 0;
      translate: -14px 14px;
      transition: all 0.8s ease-in-out;
    }

    .var-button-icon-1 {
      translate: 0px 0px;
      opacity: 1;
      transition: all 0.8s ease-in-out;
    }
  }

  &:hover {
    .var-button-text {
      scale: 1.04;
      color: #d103d1;
    }

    &::after {
      bottom: -97px;
      left: -26px;
    }

    .var-button-icon {
      translate: 3px;

      .var-button-icon-1 {
        translate: 14px -14px;
        opacity: 0;
      }

      .var-button-icon-2 {
        opacity: 1;
        translate: 0px 0px;
      }
    }
  }
}
