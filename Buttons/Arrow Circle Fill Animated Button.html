<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Color Fill Button Animated</title>
  <style>
 @import url("https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap");
body {
  margin: 0;
  font-family: "Geist", sans-serif;
  background-color: #fdf0d5;
  scale: 2;
  overflow: hidden;
}

* {
  box-sizing: border-box;
  padding: 0;
  margin: 0;
}

.container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  gap: 20px;
}

.button-wrapper-varient-one {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 56px;
  padding: 0 60px 0 22px;
  border-radius: 100px;
  border: 1px solid #780000;
  background-color: #780000;
  cursor: pointer;
  overflow: hidden;
}

.button-wrapper-varient-one .button-text {
  color: #fff;
  font-size: 16px;
  font-weight: 400;
  text-transform: uppercase;
  z-index: 2;
  transition: color 1s ease-in-out;
}

.button-wrapper-varient-one .arrow-wrapper {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  background-color: #fff;
  border-radius: 50%;
  z-index: 12;
  display: flex;
  justify-content: center;
  align-items: center;
  border: none;
  transition: background-color 1s ease-in-out;
}
.button-wrapper-varient-one .arrow-wrapper svg path {
  transition: all 1s ease-in-out;
}

.button-wrapper-varient-one .expand-bg {
  content: "";
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%) scale(0);
  width: 48px;
  height: 48px;
  background-color: #fff;
  border-radius: 50%;
  z-index: 1;
  transition: transform 1s ease-in-out;
}

.button-wrapper-varient-one .inner-circle {
  content: "";
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%) scale(0);
  width: 48px;
  height: 48px;
  background-color: #780000;
  border-radius: 50%;
  z-index: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: transform 0.4s linear 0.2s;
}

.button-wrapper-varient-one:hover .expand-bg {
  transform: translateY(-50%) scale(13);
}

.button-wrapper-varient-one:hover .inner-circle {
  transform: translateY(-50%) scale(1);
}

.button-wrapper-varient-one:hover .button-text {
  color: #780000;
}

.button-wrapper-varient-one:hover .arrow-icon path {
  stroke: #fff;
}
.button-wrapper-varient-one:hover .arrow-wrapper {
  background-color: #00000000;
}

  </style>
</head>
<body>
  <div class="container">
  <div class="button-wrapper-varient-one">
    <span class="button-text">EXPLORE OUR SERVICES</span>

    <div class="expand-bg"></div>

    <div class="inner-circle"></div>

    <div class="arrow-wrapper">
      <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M7 16.0003L16.0913 6.90942" stroke="#780000" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="round" />
        <path d="M7.90875 6H17V15.0908" stroke="#780000" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="round" />
      </svg>
    </div>
  </div>
</div>
</body>
</html>
