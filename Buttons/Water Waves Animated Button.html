    <title>Arrow Color Fill Button Animated</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap");

body {
  margin: 0;
  padding: 0;
  background-color: #f0f0f0;
  font-family: "Rubik", sans-serif;
  scale: 2;
  overflow: hidden;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
.WaveButtonWrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.WaveButtonWrapper a {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-decoration: none;
  position: relative;
  min-width: 150px;
  padding: 0 26px 0 26px;
  height: 50px;
  background-color: #ffffff;
  border-radius: 100px;
  overflow: hidden;
  border: 2px solid #3d9ace;
  transition: all 1.5s cubic-bezier(0.91, 0, 0.35, 1);
}
.WaveButtonWrapper a span {
  font-size: 16px;
  font-weight: bold;
  color: #23668b;
  position: relative;
  z-index: 5;
  transition: all 1.5s cubic-bezier(0.91, 0, 0.35, 1);
}
.WaveButtonWrapper a svg {
  position: absolute;
  top: 0%;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  transform: translateY(0);
  transition: transform 1.5s cubic-bezier(0.91, 0, 0.35, 1);
}

.WaveButtonWrapper a svg .path-0 {
  transform: translateY(50px);
  transition: transform 1.5s cubic-bezier(0.91, 0, 0.35, 1);
}
.WaveButtonWrapper a svg .path-1 {
  transform: translateY(-90px);
  transition: transform 1.5s cubic-bezier(0.91, 0, 0.35, 1) 0.2s;
}
.WaveButtonWrapper a svg .path-2 {
  transform: translateY(-200px);
  transition: transform 1.4s cubic-bezier(0.91, 0, 0.35, 1) 0.4s;
}
.WaveButtonWrapper a:hover {
  border: 2px solid #ffffff;
  span {
    color: #ffffff;
  }
  svg .path-0 {
    transform: translateY(-200px);
  }
  svg .path-1 {
    transform: translateY(-300px);
  }
  svg .path-2 {
    transform: translateY(-400px);
  }
}
/* Wave animations */
.path-0 {
  animation: pathAnim-0 4s linear infinite;
}
.path-1 {
  animation: pathAnim-1 4s linear infinite;
}
.path-2 {
  animation: pathAnim-2 4s linear infinite;
}
