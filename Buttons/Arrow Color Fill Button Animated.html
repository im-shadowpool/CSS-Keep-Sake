<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Color Fill Button Animated</title>
  <style>
    body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background-color: #f0f0f0;
  scale: 2;
  overflow: hidden;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
.arrowColorFillButtonWrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  a {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px 58px 20px 24px;
    font-size: 16px;
    font-weight: 400;
    border-radius: 100px;
    background-color: #154633;
    text-decoration: none;
    border: 1px solid transparent;

    span {
      color: white;
      font-size: 16px;
      font-style: normal;
      font-weight: 500;
      line-height: 14px;
      position: relative;
      z-index: 5;
      transition: all 1s cubic-bezier(0.91, 0, 0.35, 1);
    }

    svg {
      display: inline-block;
      position: absolute;
      right: 20px;
      transform: rotate(0deg) translateX(0) translateX(0);
      transition: transform 1s cubic-bezier(0.91, 0, 0.35, 1);
      transition: all 1s cubic-bezier(0.91, 0, 0.35, 1);
      transform-origin: left;
      width: 20px;
      height: 20px;
      z-index: 5;
      margin-left: 0px;
      path {
        stroke: #154633;
        transition: stroke 1s ease;
      }
    }

    &::before {
      content: "";
      background-color: #f6f4e7;
      width: 32px;
      height: 32px;
      position: absolute;
      z-index: 1;
      border-radius: 100px;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      transition: all 1s cubic-bezier(0.91, 0, 0.35, 1);
    }
    &::after {
      content: "";
      background-color: #154633;
      width: 0px;
      height: 0px;
      position: absolute;
      z-index: 1;
      border-radius: 100px;
      top: 50%;
      right: 30px;
      opacity: 0;
      transform: translateY(-50%);
      transition: all 1s cubic-bezier(0.91, 0, 0.35, 1);
    }
  }

  a:hover {
    span {
      color: #154633;
    }

    &::before {
      width: 100%;
      height: 100%;
      right: 0;
    }
    &::after {
      width: 32px;
      height: 32px;
      opacity: 1;
      right: 14px;
    }
    svg {
      transform: rotate(45deg) translateX(-6px) translateY(-4px);
      right: 16px;
      path {
        stroke: white;
      }
    }
  }
}

  </style>
</head>
<body>
    <div class="arrowColorFillButtonWrapper">
  <a href="#">
    <span class="">Apply for Appointment</span>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4.66669 11.3334L11.3334 4.66669" stroke="white" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M4.66669 4.66669H11.3334V11.3334" stroke="white" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </a>
</div>
</body>
</html>
